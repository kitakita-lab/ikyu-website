# ikyu-website の CI。PR と main への push で、ローカルの `npm run verify` と同じ検査を行う。
# KitaKita Lab の CI(ジョブ名 Quality Checks)に名前と流れを揃えている。違いは次の2点。
#   - カバレッジ閾値は設けない(画面の部品の単体テストより、データと生成HTMLの検査で事故を防ぐ方針)
#   - ビルド後に scripts/check-site.mjs で out/ の HTML を検査する
# 本番への配信は Cloudflare Pages が担う(このワークフローはデプロイしない)。
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    # Ruleset の必須チェックはこの名前で指定する。変更するときは Ruleset 側も合わせること
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Cloudflare Pages の NODE_VERSION=22 に合わせる。
      # テストは .ts を Node の型除去機能で読み込むため 22.18 以上が必要(22 系の最新が入る)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Content & design token tests
        run: npm test

      # Google Fonts の CSS は取得元によって形式が変わり、GitHub Actions ではフォント URL に
      # クエリが付いた形式が返って Turbopack のビルドが失敗する(scripts/update-font-fixture.mjs に経緯)。
      # CI では本番(Cloudflare Pages)と同じ形式の CSS を固定データから読ませる。フォントファイルは Google から取得する。
      - name: Build
        run: npm run build
        env:
          NEXT_FONT_GOOGLE_MOCKED_RESPONSES: ${{ github.workspace }}/tests/fixtures/google-fonts-css.json

      - name: Check built site
        run: npm run check:site
